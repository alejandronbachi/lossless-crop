name: 1 - Compile App Binables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Automatically triggers whenever you push a tag like v1.0.0, v2.1.3,
jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # DYNAMIC CACHE ENGINE: Stores and restores pip dependencies automatically
    - name: Cache Python Dependencies
      uses: actions/cache@v4
      id: pip-cache
      with:
        path: |
          ~/.cache/pip
          ${{ env.pythonLocation }}\Lib\site-packages
        key: ${{ matrix.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ matrix.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m pip install --upgrade --force-reinstall pyinstaller

    - name: Prepare jpegtran binary (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libjpeg-turbo-progs
        mkdir -p binaries
        cp $(which jpegtran) binaries/jpegtran_linux
        chmod +x binaries/jpegtran_linux

    - name: Prepare jpegtran binary (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        HOMEBREW_NO_AUTO_UPDATE=1 brew install jpeg
        mkdir -p binaries
        cp $(which jpegtran) binaries/jpegtran_mac
        chmod +x binaries/jpegtran_mac

    - name: Verify binaries
      run: |
        python -c "import pathlib; print(list(pathlib.Path('binaries').iterdir()))"

    # Creates a flat version.txt string file so your Python app can read its own tag at runtime
    - name: Inject Version Metadata
      run: |
        echo "${{ github.ref_name }}" > version.txt

    - name: Inject Production FormSubmit Token
      run: |
        python -c "
        import os
        filename = 'config/app_constants.py'
        if not os.path.exists(filename):
            print(f'Error: {filename} not found.')
            exit(1)
            
        with open(filename, 'r', encoding='utf-8') as f:
            content = f.read()
        
        # Precision swap of your dev token key for your GitHub production secret
        updated_content = content.replace('DEV_PLACEHOLDER_TOKEN', '${{ secrets.FORMSUBMIT_TOKEN }}')
        
        with open(filename, 'w', encoding='utf-8') as f:
            f.write(updated_content)
        print('Production feedback security token injected successfully.')
        "
      shell: bash

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller lossless_crop.spec

    # Upload Target A: Portable Independent Single Executable File
    - name: Upload Windows Standalone EXE Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: staging-windows
        path: dist/LosslessCrop.exe

    # Upload Target B: Uncompressed Side Directory Folder (For MSIX Building)
    - name: Upload Windows App Directory Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: staging-windows-store-folder
        path: dist/LosslessCropAppFolder/


    # ---------------------------------------------------------------------
    # LINUX TARGET: RETAIN TERMINAL BINARY AND COMPILE APPIMAGE
    # ---------------------------------------------------------------------
    - name: Package Linux Terminal Binary and AppImage
      if: matrix.os == 'ubuntu-latest'
      run: |
        # 1. Preserve the raw terminal binary artifact just like before
        mkdir -p dist/LinuxTerminal/
        cp dist/LosslessCrop dist/LinuxTerminal/LosslessCrop
        
        # 2. Create the AppDir root layout directory for the AppImage
        mkdir -p AppDir
        cp dist/LosslessCrop AppDir/LosslessCrop
        
        # 3. Create the required AppRun launch orchestrator script
        echo '#!/bin/sh' > AppDir/AppRun
        echo 'HERE="$(dirname "$(readlink -f "${0}")")"' >> AppDir/AppRun
        echo 'EXEC="${HERE}/LosslessCrop"' >> AppDir/AppRun
        echo 'exec "${EXEC}" "$@"' >> AppDir/AppRun
        chmod +x AppDir/AppRun
        
        # 4. Create the standard Linux .desktop metadata file
        echo '[Desktop Entry]' > AppDir/lossless_crop.desktop
        echo 'Type=Application' >> AppDir/lossless_crop.desktop
        echo 'Name=Lossless Crop' >> AppDir/lossless_crop.desktop
        echo 'Comment=A cross-platform lossless image cropping application' >> AppDir/lossless_crop.desktop
        echo 'Exec=LosslessCrop' >> AppDir/lossless_crop.desktop
        echo 'Icon=lossless_crop' >> AppDir/lossless_crop.desktop
        echo 'Categories=Graphics;' >> AppDir/lossless_crop.desktop
        
        # 5. Place your application icon at the root level
        cp assets/icons/icon.png AppDir/lossless_crop.png
        
        # 6. Download the official AppImage packaging tool
        wget -q https://github.com
        chmod +x appimagetool-x86_64.AppImage
        
        # 7. Compress the AppDir folder into a single executable binary
        ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir LosslessCrop-x86_64.AppImage

    # TARGET A: Upload raw terminal binary
    - name: Upload Linux Terminal Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: staging-linux
        path: dist/LinuxTerminal/LosslessCrop

    # TARGET B: Upload user-friendly AppImage
    - name: Upload Linux AppImage Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: staging-linux-appimage
        path: LosslessCrop-x86_64.AppImage

    - name: Compress macOS Binary for Permissions Protection
      if: matrix.os == 'macos-latest'
      run: |
        tar -czvf LosslessCrop-macOS.tar.gz -C dist LosslessCrop

    - name: Upload macOS Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: staging-macos
        path: LosslessCrop-macOS.tar.gz

  build_msix:
    name: Package Unsigned MSIX Container for Windows Store
    needs: build 
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Staged Windows App Folder Directory
      uses: actions/download-artifact@v4
      with:
        name: staging-windows-store-folder
        path: LosslessCropAppFolder

    - name: Repair Layout and Inject Dynamic Release Version
      shell: powershell
      run: |
        # 1. Flatten structure if the download step double-nested the target folder
        if (Test-Path "LosslessCropAppFolder\LosslessCropAppFolder") {
            Move-Item -Path "LosslessCropAppFolder\LosslessCropAppFolder\*" -Destination "LosslessCropAppFolder\" -Force
            Remove-Item -Path "LosslessCropAppFolder\LosslessCropAppFolder" -Recurse -Force
        }
        
        # 2. Explicit copy ensuring the file sits directly in the root distribution path
        Copy-Item -Path "uwp_metadata\AppxManifest.xml" -Destination "LosslessCropAppFolder\AppxManifest.xml" -Force

        # 3. Parse GitHub Tag (e.g., v1.4.2 -> 1.4.2.0)
        $TagVersion = "${{ github.ref_name }}"
        if ($TagVersion -match "^v?(\d+\.\d+\.\d+)") {
            $CleanVersion = $Matches[1] + ".0"
        } else {
            $CleanVersion = "1.0.0.0" # Fallback if manual workflow run without a tag
        }
        Write-Host "Setting package version to: $CleanVersion"

        # 4. Dynamically inject the new version into the manifest file
        $ManifestPath = "LosslessCropAppFolder\AppxManifest.xml"
        $Content = Get-Content $ManifestPath
        $Content = $Content -replace 'Version="1.0.0.0"', "Version=`"$CleanVersion`""
        Set-Content -Path $ManifestPath -Value $Content -Encoding UTF8

    - name: Prepare MSIX Assets Environment Layout
      run: |
        TARGET_ICON_DIR="LosslessCropAppFolder/_internal/assets/icons"
        mkdir -p "$TARGET_ICON_DIR"
        
        # Pulls the clean assets compiled by your local script pipeline
        cp assets/uwp/Square150x150Logo.png "$TARGET_ICON_DIR/Square150x150Logo.png"
        cp assets/uwp/Square44x44Logo.png   "$TARGET_ICON_DIR/Square44x44Logo.png"
        cp assets/uwp/StoreLogo.png         "$TARGET_ICON_DIR/StoreLogo.png"
        cp assets/uwp/Wide310x150Logo.png   "$TARGET_ICON_DIR/Wide310x150Logo.png"
        cp assets/uwp/SplashScreen.png      "$TARGET_ICON_DIR/SplashScreen.png"
      shell: bash

    - name: Compile and Bundle Unsigned App Bundle (.msixupload)
      run: |
        $SdkPath = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\10.*" | 
                    Sort-Object Name -Descending | 
                    Select-Object -First 1
        
        if (-not $SdkPath) {
            Write-Error "Windows SDK binary paths could not be located on this runner."
            exit 1
        }
        
        $MakeAppxExe = Join-Path $SdkPath.FullName "x64\makeappx.exe"
        Write-Host "Found MakeAppx at: $MakeAppxExe"
        
        # Swapped target file extension to .msixupload for official storefront submission
        & $MakeAppxExe pack /d LosslessCropAppFolder /p LosslessCrop.msixupload
      shell: powershell

    - name: Upload Store Ready Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: production-store-bundle
        path: LosslessCrop.msixupload
        