name: 1 - Compile App Binables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Automatically triggers whenever you push a tag like v1.0.0, v2.1.3,
jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Prepare jpegtran binary (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libjpeg-turbo-progs
        mkdir -p binaries
        cp $(which jpegtran) binaries/jpegtran_linux
        chmod +x binaries/jpegtran_linux

    - name: Prepare jpegtran binary (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        HOMEBREW_NO_AUTO_UPDATE=1 brew install jpeg
        mkdir -p binaries
        cp $(which jpegtran) binaries/jpegtran_mac
        chmod +x binaries/jpegtran_mac

    - name: Verify binaries
      run: |
        python -c "import pathlib; print(list(pathlib.Path('binaries').iterdir()))"

    # Creates a flat version.txt string file so your Python app can read its own tag at runtime
    - name: Inject Version Metadata
      run: |
        echo "${{ github.ref_name }}" > version.txt

    - name: Inject Production FormSubmit Token
      run: |
        python -c "
        import os
        filename = 'config/app_constants.py'
        if not os.path.exists(filename):
            print(f'Error: {filename} not found.')
            exit(1)
            
        with open(filename, 'r', encoding='utf-8') as f:
            content = f.read()
        
        # Precision swap of your dev token key for your GitHub production secret
        updated_content = content.replace('DEV_PLACEHOLDER_TOKEN', '${{ secrets.FORMSUBMIT_TOKEN }}')
        
        with open(filename, 'w', encoding='utf-8') as f:
            f.write(updated_content)
        print('Production feedback security token injected successfully.')
        "
      shell: bash

    - name: Build with PyInstaller
      run: |
        pyinstaller lossless_crop.spec

    # Upload Target A: Portable Independent Single Executable File
    - name: Upload Windows Standalone EXE Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: staging-windows
        path: dist/LosslessCrop.exe

    # Upload Target B: Uncompressed Side Directory Folder (For MSIX Building)
    - name: Upload Windows App Directory Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: staging-windows-store-folder
        path: dist/LosslessCropAppFolder/


    - name: Upload Linux Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: staging-linux
        path: dist/LosslessCrop

    - name: Compress macOS Binary for Permissions Protection
      if: matrix.os == 'macos-latest'
      run: |
        tar -czvf LosslessCrop-macOS.tar.gz -C dist LosslessCrop

    - name: Upload macOS Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: staging-macos
        path: LosslessCrop-macOS.tar.gz

  build_msix:
    name: Package MSIX Installer for Windows Store
    needs: build 
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Staged Windows App Folder Directory
      uses: actions/download-artifact@v4
      with:
        name: staging-windows-store-folder
        path: LosslessCropAppFolder

    - name: Prepare MSIX Assets Environment Layout
      run: |
        cp uwp_metadata/AppxManifest.xml LosslessCropAppFolder/
        
        TARGET_ICON_DIR="LosslessCropAppFolder/_internal/assets/icons"
        mkdir -p "$TARGET_ICON_DIR"
        
        cp assets/icons/icon.png "$TARGET_ICON_DIR/Square150x150Logo.png"
        cp assets/icons/icon.png "$TARGET_ICON_DIR/Square44x44Logo.png"
        cp assets/icons/icon.png "$TARGET_ICON_DIR/StoreLogo.png"
        cp assets/icons/icon.png "$TARGET_ICON_DIR/Wide310x150Logo.png"
        cp assets/icons/icon.png "$TARGET_ICON_DIR/SplashScreen.png"
      shell: bash

    # DYNAMIC ENGINE: Automatically locates and extracts the active Windows SDK compiler binary paths
    - name: Compile Folder directory into MSIX Container Package
      run: |
        $SdkPath = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\10.*" | 
                    Sort-Object Name -Descending | 
                    Select-Object -First 1
        
        if (-not $SdkPath) {
            Write-Error "Windows SDK binary paths could not be located on this runner."
            exit 1
        }
        
        $MakeAppxExe = Join-Path $SdkPath.FullName "x64\makeappx.exe"
        Write-Host "Found MakeAppx at: $MakeAppxExe"
        
        & $MakeAppxExe pack /d LosslessCropAppFolder /p LosslessCrop.msix
      shell: powershell

    - name: Generate Local Developer Self-Signed Code Certificate
      run: |
        New-SelfSignedCertificate -Type Custom -Subject "CN=AlejandroNBachi" -KeyUsage DigitalSignature -FriendlyName "LosslessCropDevCert" -CertStoreLocation "Cert:\CurrentUser\My"
        $password = ConvertTo-SecureString "LosslessCropPass123!" -AsPlainText -Force
        Export-PfxCertificate -Cert Cert:\CurrentUser\My\* -FilePath dev_cert.pfx -Password $password
      shell: powershell

    # DYNAMIC ENGINE: Applies the same automated location tracker layout to target signtool.exe safely
    - name: Sign MSIX Installer Package Binary
      run: |
        $SdkPath = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\10.*" | 
                    Sort-Object Name -Descending | 
                    Select-Object -First 1
                    
        $SignToolExe = Join-Path $SdkPath.FullName "x64\signtool.exe"
        Write-Host "Found SignTool at: $SignToolExe"
        
        & $SignToolExe sign /fd SHA256 /a /f dev_cert.pfx /p "LosslessCropPass123!" LosslessCrop.msix
      shell: powershell

    - name: Upload Signed MSIX Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: staging-windows-msix
        path: LosslessCrop.msix

