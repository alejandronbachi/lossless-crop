name: 1 - Compile App Binables

on:
  # Keeps only the manual web button active so you can test compilation safely
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Prepare jpegtran binary (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libjpeg-turbo-progs
        mkdir -p binaries
        cp $(which jpegtran) binaries/jpegtran_linux
        chmod +x binaries/jpegtran_linux

    - name: Prepare jpegtran binary (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        HOMEBREW_NO_AUTO_UPDATE=1 brew install jpeg
        mkdir -p binaries
        cp $(which jpegtran) binaries/jpegtran_mac
        chmod +x binaries/jpegtran_mac

    - name: Verify binaries
      run: |
        python -c "import pathlib; print(list(pathlib.Path('binaries').iterdir()))"

    - name: Build with PyInstaller
      run: |
        pyinstaller lossless_crop.spec

    - name: Archive Windows Build
      if: matrix.os == 'windows-latest'
      run: |
        # Target the standalone .exe file directly instead of a folder
        Compress-Archive -Path dist/LosslessCrop.exe -DestinationPath LosslessCrop-Windows.zip

    - name: Archive Linux Build
      if: matrix.os == 'ubuntu-latest'
      run: |
        # This targets the compiled standalone binary file directly inside dist/
        tar -czvf LosslessCrop-Linux.tar.gz -C dist LosslessCrop

    - name: Archive macOS Build
      if: matrix.os == 'macos-latest'
      run: |
        # This targets the compiled standalone binary file directly inside dist/
        tar -czvf LosslessCrop-macOS.tar.gz -C dist LosslessCrop

    - name: Upload Windows Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: staging-windows
        path: LosslessCrop-Windows.zip

    - name: Upload Linux Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: staging-linux
        path: LosslessCrop-Linux.tar.gz

    - name: Upload macOS Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: staging-macos
        path: LosslessCrop-macOS.tar.gz
