name: 2 - Deploy Binables to Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  deploy:
    name: Publish Staged Assets to Active Release
    runs-on: ubuntu-latest

    steps:
    - name: Download Staged Windows Binaries
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build.yml
        name: staging-windows
        path: ./artifacts

    - name: Label Windows Binary
      run: mv ./artifacts/LosslessCrop.exe ./artifacts/LosslessCrop-Windows.exe || true

    - name: Download Staged Linux Binaries
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build.yml
        name: staging-linux
        path: ./artifacts

    - name: Label Linux Binary
      run: mv ./artifacts/LosslessCrop ./artifacts/LosslessCrop-Linux || true

    - name: Download Staged macOS Binaries
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build.yml
        name: staging-macos
        path: ./artifacts

    - name: Verify Staged Asset Tree
      run: |
        ls -la ./artifacts

    - name: Publish All Assets to Active Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifacts/*
        tag: v1.0.0-beta # Ensure this string always matches your target release tag name!
        overwrite: true
        file_glob: true
