name: 2 - Deploy Binables to Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  deploy:
    name: Publish Staged Assets to Active Release
    runs-on: ubuntu-latest

    steps:
    - name: Download Staged Windows Binaries
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build.yml
        name: staging-windows
        path: ./artifacts

    # Dynamically injects the runtime branch or tag name into the filename
    - name: Label Windows Binary
      run: mv ./artifacts/LosslessCrop.exe ./artifacts/LosslessCrop-${{ github.ref_name }}-Windows-Portable.exe || true

    # TARGET 2: DOWNLOAD AND COMPRESS THE WINDOWS STORE FOLDER STRUCTURE
    - name: Download Windows App Folder Directory
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build.yml
        name: staging-windows-store-folder
        path: ./artifacts/LosslessCropAppFolder

    # Compresses the thin directory structure into a distribution ZIP package
    - name: Compress Thinner Binaries Directory to Distribution Zip Archive
      run: |
        cd ./artifacts
        zip -r LosslessCrop-${{ github.ref_name }}-Windows-Files.zip LosslessCropAppFolder/
        rm -rf LosslessCropAppFolder/

    - name: Download Staged Linux Binaries
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build.yml
        name: staging-linux
        path: ./artifacts

    - name: Label Linux Binary
      run: mv ./artifacts/LosslessCrop ./artifacts/LosslessCrop-${{ github.ref_name }}-Linux || true

    - name: Download Staged macOS Binaries
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build.yml
        name: staging-macos
        path: ./artifacts

    # Dynamically rename the mac archive file to include the release tag
    - name: Label macOS Binary
      run: mv ./artifacts/LosslessCrop-macOS.tar.gz ./artifacts/LosslessCrop-${{ github.ref_name }}-macOS.tar.gz || true

    - name: Verify Staged Asset Tree
      run: |
        ls -la ./artifacts

    - name: Publish All Assets to Active Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifacts/*
        # If running on main, it uploads to a safe 'v-test' draft page instead of breaking your release targets
        tag: ${{ github.ref_name == 'main' && 'v-test' || github.ref_name }}
        overwrite: true
        file_glob: true
